<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zikir &amp; Doa Harian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ungu-950: #1d0b36;
    --ungu-900: #2c1452;
    --ungu-800: #4a2384;
    --ungu-700: #6a3cb0;
    --ungu-500: #9068d0;
    --ungu-200: #d9c9f2;
    --ungu-100: #ece4f8;
    --latar: #f4f0fa;
    --putih: #ffffff;
    --teks: #24133d;
    --teks-redup: #6b5a88;
    --garis: #cbbde6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --latar: #1a0f2e;
      --putih: #26153f;
      --teks: #efe8fb;
      --teks-redup: #b9a7d9;
      --garis: #3d2a5c;
      --ungu-100: #2e1c4d;
    }
  }
  :root[data-theme="dark"] {
    --latar: #1a0f2e;
    --putih: #26153f;
    --teks: #efe8fb;
    --teks-redup: #b9a7d9;
    --garis: #3d2a5c;
    --ungu-100: #2e1c4d;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0c0616;
    color: var(--teks);
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  /* ---- Bingkai ponsel ---- */
  .phone {
    width: 360px;
    height: 640px;
    max-width: 100%;
    display: flex;
    flex-direction: column;
    background: var(--latar);
    border-radius: 22px;
    border: 10px solid #2a2a33;
    box-shadow: 0 0 0 2px #444, 0 20px 50px rgba(0,0,0,.6);
    overflow: hidden;
  }
  @media (max-width: 480px) {
    body { padding: 0; }
    .phone { width: 100vw; height: 100vh; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
  }

  /* ---- Status bar ---- */
  .statusbar {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 22px;
    padding: 0 10px;
    background: var(--ungu-950);
    color: #e8dcff;
    font-size: 11px;
    letter-spacing: .5px;
  }

  /* ---- Title bar ---- */
  .titlebar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 46px;
    padding: 0 12px;
    background: linear-gradient(180deg, var(--ungu-700), var(--ungu-800));
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    border-bottom: 2px solid var(--ungu-950);
  }
  .titlebar .ikon-judul {
    width: 26px; height: 26px; border-radius: 4px;
    background: #fff; color: var(--ungu-800);
    display: grid; place-items: center; font-size: 15px;
    flex: 0 0 auto;
  }
  .titlebar .judul-teks { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- Layar utama ---- */
  .screen {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    outline: none;
    padding-bottom: 8px;
  }

  /* ---- Grid menu utama ---- */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 10px 8px;
  }
  .sel-grid {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 6px;
    padding: 10px 4px 8px;
    background: var(--putih);
    border: 2px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    text-align: center;
    color: var(--teks);
    font: inherit;
    font-size: 12px;
    min-height: 102px;
  }
  .sel-grid .ikon {
    width: 46px; height: 46px; border-radius: 8px;
    background: linear-gradient(160deg, var(--ungu-500), var(--ungu-800));
    color: #fff; font-size: 22px;
    display: grid; place-items: center;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.25);
  }
  .sel-grid:focus, .sel-grid.aktif {
    outline: none;
    border-color: var(--ungu-700);
    background: var(--ungu-100);
  }

  /* ---- Daftar (list) ---- */
  .daftar { list-style: none; margin: 0; padding: 0; }
  .baris {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--garis);
    background: var(--putih);
    cursor: pointer;
    color: var(--teks);
    min-height: 56px;
    outline: none;
  }
  .baris .nomor {
    width: 30px; height: 30px; flex: 0 0 auto;
    border-radius: 50%;
    background: var(--ungu-100);
    color: var(--ungu-800);
    display: grid; place-items: center;
    font-weight: 700; font-size: 13px;
  }
  .baris .teks-baris { flex: 1 1 auto; min-width: 0; }
  .baris .judul-item { font-size: 15px; font-weight: 700; }
  .baris .sub-item { font-size: 12px; color: var(--teks-redup); margin-top: 2px; }
  .baris .panah { color: var(--ungu-500); font-size: 18px; flex: 0 0 auto; }
  .baris:focus, .baris.aktif {
    background: var(--ungu-700);
    color: #fff;
  }
  .baris:focus .sub-item, .baris.aktif .sub-item { color: #e6dbff; }
  .baris:focus .nomor, .baris.aktif .nomor { background: #fff; color: var(--ungu-800); }
  .baris:focus .panah, .baris.aktif .panah { color: #fff; }

  /* ---- Halaman item (zikir / doa) ---- */
  .detail { padding: 12px; }
  .kartu {
    background: var(--putih);
    border: 1px solid var(--garis);
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .label {
    font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
    color: var(--ungu-700); margin-bottom: 6px;
  }
  .arab {
    font-family: "Amiri", "Traditional Arabic", "Times New Roman", serif;
    direction: rtl; text-align: right;
    font-size: 24px; line-height: 2; color: var(--teks);
    margin: 0;
  }
  .latin { font-size: 14px; line-height: 1.55; margin: 0; font-style: italic; color: var(--teks); }
  .arti { font-size: 14px; line-height: 1.55; margin: 0; color: var(--teks); }
  .meta { font-size: 12px; color: var(--teks-redup); margin-top: 8px; }

  .penghitung {
    background: var(--ungu-100);
    border: 1px solid var(--ungu-200);
    border-radius: 6px;
    padding: 12px;
    text-align: center;
  }
  .penghitung .angka {
    font-size: 40px; font-weight: 700; color: var(--ungu-800); line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .penghitung .target { font-size: 12px; color: var(--teks-redup); }
  .penghitung .status { font-size: 13px; font-weight: 700; color: var(--ungu-700); margin-top: 4px; min-height: 18px; }
  .btn-hitung {
    margin-top: 10px;
    width: 100%;
    padding: 12px;
    font: inherit; font-size: 15px; font-weight: 700;
    background: linear-gradient(180deg, var(--ungu-700), var(--ungu-800));
    color: #fff; border: 0; border-radius: 6px; cursor: pointer;
  }
  .btn-hitung:active { transform: translateY(1px); }

  .panduan p, .panduan li { font-size: 14px; line-height: 1.6; color: var(--teks); }
  .panduan ul { padding-left: 18px; margin: 6px 0; }
  .panduan h3 { font-size: 15px; color: var(--ungu-700); margin: 14px 0 6px; }
  .catatan { font-size: 12px; color: var(--teks-redup); }

  /* ---- Softkey (tombol kiri/kanan bawah ala Symbian) ---- */
  .softkeys {
    flex: 0 0 auto;
    display: flex;
    height: 44px;
    background: linear-gradient(180deg, var(--ungu-800), var(--ungu-950));
    border-top: 2px solid var(--ungu-950);
  }
  .softkeys button {
    flex: 1 1 50%;
    border: 0;
    background: transparent;
    color: #fff;
    font: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer;
    padding: 0 6px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .softkeys button + button { border-left: 1px solid rgba(255,255,255,.18); }
  .softkeys button:disabled { color: rgba(255,255,255,.3); cursor: default; }
  .softkeys button:not(:disabled):active { background: rgba(255,255,255,.15); }
</style>
</head>
<body>
<div class="phone" id="ponsel">
  <div class="statusbar">
    <span>▂▄▆█ ZUA</span>
    <span id="jam">--:--</span>
    <span>▮▮▮▯</span>
  </div>
  <header class="titlebar">
    <span class="ikon-judul" id="ikon-judul">✦</span>
    <span class="judul-teks" id="judul">Zikir &amp; Doa</span>
  </header>
  <main class="screen" id="layar" tabindex="-1"></main>
  <nav class="softkeys">
    <button id="sk-kiri" type="button"></button>
    <button id="sk-kanan" type="button"></button>
  </nav>
</div>

/* Zikir pagi & petang: bagian yang sama + satu kalimat pembuka yang berbeda */
function zikirHarian(waktu) {
  const pagi = waktu === "pagi";
  const pembuka = pagi ? {

/* =========================================================
   ROUTING
   ========================================================= */
const layar = document.getElementById("layar");
const judulEl = document.getElementById("judul");
const ikonJudul = document.getElementById("ikon-judul");
const skKiri = document.getElementById("sk-kiri");
const skKanan = document.getElementById("sk-kanan");

let hitungan = 0;      // penghitung zikir (hanya di memori, reset saat keluar)
let itemAktif = null;  // item yang sedang dibuka

function rute() {
  const h = location.hash.replace(/^#\/?/, "");
  const bagian = h.split("/").filter(Boolean);
  if (bagian[0] === "kat" && DATA[bagian[1]]) return { tipe: "kat", kat: bagian[1] };
  if (bagian[0] === "item" && DATA[bagian[1]]) {
    const item = DATA[bagian[1]].items.find(i => i.id === bagian[2]);
    if (item) return { tipe: "item", kat: bagian[1], item };
  }
  if (bagian[0] === "panduan") return { tipe: "panduan" };
  return { tipe: "beranda" };
}

function go(hash) {
  if (location.hash === hash) render(); else location.hash = hash;
}

function induk(r) {
  if (r.tipe === "kat" || r.tipe === "panduan") return "#/";
  if (r.tipe === "item") return "#/kat/" + r.kat;
  return null;
}

function setSoftkeys(kiri, kanan, aksiKiri, aksiKanan) {
  skKiri.textContent = kiri || "";
  skKanan.textContent = kanan || "";
  skKiri.disabled = !kiri;
  skKanan.disabled = !kanan;
  skKiri.onclick = kiri ? aksiKiri : null;
  skKanan.onclick = kanan ? aksiKanan : null;
}

function kembali() {
  const h = induk(rute());
  if (h) go(h);
}

/* ---- Render ---- */
function render() {
  const r = rute();
  itemAktif = null;
  if (r.tipe !== "item") hitungan = 0;

  if (r.tipe === "beranda") renderBeranda();
  else if (r.tipe === "kat") renderKategori(r.kat);
  else if (r.tipe === "item") renderItem(r.kat, r.item);
  else if (r.tipe === "panduan") renderPanduan();

  layar.scrollTop = 0;
}

function renderBeranda() {
  judulEl.textContent = "Zikir & Doa";
  ikonJudul.textContent = "✦";
  const kotak = Object.entries(DATA).map(([k, v], i) => `
    <button class="sel-grid" data-nav="1" data-go="#/kat/${k}" type="button">
      <span class="ikon">${v.ikon}</span>
      <span>${v.judul}</span>
    </button>`).join("");
  layar.innerHTML = `
    <div class="grid">${kotak}
      <button class="sel-grid" data-nav="1" data-go="#/panduan" type="button">
        <span class="ikon">i</span><span>Panduan</span>
      </button>
    </div>`;
  setSoftkeys("Buka", "", bukaFokus, null);
  pilihAwal();
}

function renderKategori(k) {
  const kat = DATA[k];
  judulEl.textContent = kat.judul;
  ikonJudul.textContent = kat.ikon;
  const baris = kat.items.map((it, i) => `
    <li class="baris" data-nav="1" data-go="#/item/${k}/${it.id}" tabindex="0">
      <span class="nomor">${i + 1}</span>
      <span class="teks-baris">
        <div class="judul-item">${it.judul}</div>
        <div class="sub-item">${it.ulang > 1 ? "Dibaca " + it.ulang + "x" : "Dibaca 1x"}</div>
      </span>
      <span class="panah">›</span>
    </li>`).join("");
  layar.innerHTML = `<ul class="daftar">${baris}</ul>`;
  setSoftkeys("Buka", "Kembali", bukaFokus, () => go("#/"));
  pilihAwal();
}

function renderItem(k, it) {
  itemAktif = it;
  judulEl.textContent = it.judul;
  ikonJudul.textContent = "❝";
  const label = it.ulang > 1 ? `Target ${it.ulang}x` : "Dibaca 1x";
  layar.innerHTML = `
    <div class="detail">
      <div class="kartu">
        <div class="label">Teks Arab</div>
        <p class="arab">${it.arab}</p>
      </div>
      <div class="kartu">
        <div class="label">Latin</div>
        <p class="latin">${it.latin}</p>
      </div>
      <div class="kartu">
        <div class="label">Artinya</div>
        <p class="arti">${it.arti}</p>
        ${it.sumber ? `<div class="meta">${it.sumber}</div>` : ""}
        ${it.catatan ? `<div class="meta">${it.catatan}</div>` : ""}
      </div>
      <div class="penghitung">
        <div class="label" style="margin-bottom:2px">Penghitung</div>
        <div class="angka" id="angka">${hitungan}</div>
        <div class="target">${label}</div>
        <div class="status" id="status"></div>
        <button class="btn-hitung" id="btn-hitung" type="button">Hitung +1</button>
      </div>
    </div>`;
  document.getElementById("btn-hitung").onclick = tambahHitung;
  perbaruiHitung();
  setSoftkeys("Hitung", "Kembali", tambahHitung, () => go("#/kat/" + rute().kat));
}

function tambahHitung() {
  if (!itemAktif) return;
  const target = itemAktif.ulang;
  if (hitungan >= target) hitungan = 0; else hitungan++;
  perbaruiHitung();
}

function perbaruiHitung() {
  if (!itemAktif) return;
  const target = itemAktif.ulang;
  const angka = document.getElementById("angka");
  const status = document.getElementById("status");
  const btn = document.getElementById("btn-hitung");
  if (!angka) return;
  angka.textContent = hitungan;
  const selesai = hitungan >= target;
  status.textContent = selesai ? "Selesai ✓" : "";
  btn.textContent = selesai ? "Ulang dari 0" : "Hitung +1";
  setSoftkeys(selesai ? "Ulang" : "Hitung", "Kembali", tambahHitung, () => go("#/kat/" + rute().kat));
}

function renderPanduan() {
  judulEl.textContent = "Panduan";
  ikonJudul.textContent = "i";
  layar.innerHTML = PANDUAN_HTML;
  setSoftkeys("", "Kembali", null, () => go("#/"));
}

/* ---- Navigasi keyboard & fokus (gaya Symbian) ---- */
function daftarNav() {
  return Array.from(layar.querySelectorAll("[data-nav]"));
}
function pilihAwal() {
  const list = daftarNav();
  if (!list.length) return;
  list[0].focus({ preventScroll: true });
  list[0].classList.add("aktif");
}
function bukaFokus() {
  const el = document.activeElement;
  if (el && el.dataset && el.dataset.go) go(el.dataset.go);
}
function pindahFokus(arah) {
  const list = daftarNav();
  if (!list.length) return;
  let i = list.indexOf(document.activeElement);
  i = i < 0 ? 0 : (i + arah + list.length) % list.length;
  list.forEach(e => e.classList.remove("aktif"));
  list[i].focus();
  list[i].classList.add("aktif");
  list[i].scrollIntoView({ block: "nearest" });
}

document.addEventListener("keydown", (e) => {
  const r = rute();
  if (r.tipe === "item") {
    if (e.key === "+" || e.key === " ") { e.preventDefault(); tambahHitung(); return; }
  }
  if (e.key === "ArrowDown") { e.preventDefault(); pindahFokus(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); pindahFokus(-1); }
  else if (e.key === "Enter") {
    e.preventDefault();
    if (r.tipe === "item") tambahHitung();
    else bukaFokus();
  }
  else if (e.key === "Backspace" || e.key === "Escape") {
    if (r.tipe !== "beranda") { e.preventDefault(); kembali(); }
  }
  else if (e.key === "ArrowLeft" && r.tipe !== "beranda") { kembali(); }
});

// Klik baris/kartu juga bisa dibuka
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-go]");
  if (el && el.dataset.go) go(el.dataset.go);
});

window.addEventListener("hashchange", render);

/* ---- Jam di status bar ---- */
function perbaruiJam() {
  const d = new Date();
  const jj = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  document.getElementById("jam").textContent = jj + ":" + mm;
}
perbaruiJam();
setInterval(perbaruiJam, 30000);

render();
</script>
